<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Nosológico</title>
<meta name="description" content="Atlas interactivo de psicopatología: nosología actual e histórica, semiología, etiopatogenia y terapéutica, con referencias.">
<style>
:root{
  --bg:#f0ebe1;--paper:#faf8f3;--paper2:#f4efe5;--ink:#16110c;--muted:#6b5d4e;--faint:#a89a86;--line:#d6c9b3;--line2:#e6dccb;
  --accent:#8a6820;--accent2:#b48c46;--top:#16110c;--topink:#f0e8d8;--topmuted:#9a8a76;--sel:#c8102e;--dim:.13;
  --shadow:0 12px 40px rgba(30,20,8,.16);--serif:"EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"DM Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
body.dark{--bg:#14110d;--paper:#1c1813;--paper2:#231e17;--ink:#ece3d3;--muted:#b3a58f;--faint:#7e725f;--line:#3b3226;--line2:#2c251c;--top:#0b0907;--topink:#ece3d3;--accent:#d2a957;--accent2:#e2c07a;--sel:#ff5a6e;--shadow:0 12px 40px rgba(0,0,0,.5)}
body.eink{--bg:#fff;--paper:#fff;--paper2:#fff;--ink:#000;--muted:#222;--faint:#555;--line:#000;--line2:#888;--top:#fff;--topink:#000;--topmuted:#333;--accent:#000;--accent2:#000;--sel:#000;--dim:.18;--shadow:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:auto 1fr auto}
/* ---------- barra superior ---------- */
.top{grid-column:1/-1;background:var(--top);color:var(--topink);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 12px;border-bottom:1px solid var(--line)}
body.eink .top{border-bottom:2px solid #000}
.brand{font-family:var(--serif);font-size:1.15rem;white-space:nowrap;margin-right:4px}
.brand i{color:var(--accent2)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;color:var(--topmuted);padding:5px 10px;border-radius:4px;font-size:.8rem;letter-spacing:.02em}
.tab:hover{color:var(--topink);background:rgba(255,255,255,.06)}
.tab.on{color:var(--topink);border-color:var(--accent2);background:rgba(180,140,70,.18)}
body.eink .tab.on{border:2px solid #000;background:#fff;font-weight:700}
.searchbox{position:relative;flex:1 1 260px;max-width:460px}
.searchbox input{width:100%;padding:6px 10px 6px 28px;border-radius:5px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--topink);font:inherit;font-size:.85rem}
body.eink .searchbox input{border:2px solid #000;background:#fff}
.searchbox input::placeholder{color:var(--topmuted)}
.searchbox svg{position:absolute;left:8px;top:8px;width:14px;height:14px;stroke:var(--topmuted);fill:none}
.dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:50;display:none}
.dd.on{display:block}
.dd .it{padding:7px 10px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.dd .it.act,.dd .it:hover{background:var(--paper2)}
.dd .it b{font-weight:600}
.dd .it small{color:var(--muted);font-size:.72rem;margin-left:auto;white-space:nowrap}
.dd .hint{padding:8px 10px;color:var(--muted);font-size:.75rem}
.tools{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.brk{flex-basis:100%;height:0}
.fsep{width:1px;align-self:stretch;margin:4px 2px;background:var(--topmuted);opacity:.45}
.feat{display:flex;gap:8px;flex-wrap:wrap}
.fb{display:flex;align-items:center;gap:9px;background:var(--accent2);color:#1a1209;border:1px solid var(--accent2);border-radius:7px;padding:6px 14px 6px 10px;text-align:left;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 6px rgba(0,0,0,.35);transition:transform .08s,filter .12s}
.fb:hover{filter:brightness(1.08);transform:translateY(-1px)}
.fb:focus-visible,.tb:focus-visible{outline:3px solid var(--topink);outline-offset:2px}
.fb svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fbt{display:flex;flex-direction:column;line-height:1.15}
.fbt b{font-size:.9rem;font-weight:700;letter-spacing:.01em}
.fbt small{font-size:.68rem;opacity:.82}
.cnt[hidden]{display:none}
.cnt{display:inline-block;min-width:1.5em;text-align:center;padding:0 5px;margin-left:3px;border-radius:9px;background:rgba(0,0,0,.22);color:inherit;font-size:.74rem;font-weight:700;line-height:1.45}
.fb .cnt{background:#1a1209;color:var(--accent2)}
.tb .cnt{background:var(--accent2);color:#1a1209}
.fb.on{background:transparent;color:var(--accent2);border:2px solid var(--accent2);padding:5px 13px 5px 9px}
body.eink .fb.on{background:#000;color:#fff;border-color:#000}
body.eink .fb.on .cnt{background:#fff;color:#000}
body.eink .fb{background:#fff;color:#000;border:2px solid #000;box-shadow:none}
body.eink .fb .cnt{background:#000;color:#fff}
body.eink .tb .cnt{background:#000;color:#fff}
body.dark .fb{color:#150e06}
.tb{border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--topmuted);padding:4px 8px;border-radius:4px;font-size:.75rem;white-space:nowrap}
.tb:hover{color:var(--topink)}
.tb.on{color:var(--topink);border-color:var(--accent2);background:rgba(180,140,70,.18)}
body.eink .tb.on{border-width:2px;font-weight:700}
body.eink .tb{border:1px solid #000;color:#000}
/* ---------- paneles ---------- */
.filters{grid-column:1;grid-row:2;width:256px;background:var(--paper);border-right:1px solid var(--line);overflow:auto;padding:10px 12px 30px;font-size:.8rem}
.filters.off{display:none}
.fgrp{margin:0;border-bottom:1px solid var(--line2)}
.fgrp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 2px;font-size:.78rem;font-weight:600;color:var(--ink);user-select:none}
.fgrp summary::-webkit-details-marker{display:none}
.fgrp summary::before{content:"▸";font-size:.7rem;color:var(--muted);width:.9em;transition:transform .12s}
.fgrp[open] summary::before{transform:rotate(90deg)}
.fgrp summary:hover .gt{text-decoration:underline}
.gn{margin-left:auto;background:var(--ink);color:var(--paper);border-radius:9px;padding:0 7px;font-size:.68rem;line-height:1.5}
.chips{padding:0 0 10px 14px}
.gclr{display:block;margin-top:6px;border:none;background:none;color:var(--accent);font-size:.7rem;text-decoration:underline}
.fsticky{position:sticky;top:-10px;margin:-10px -12px 6px;padding:10px 12px 8px;background:var(--paper);z-index:3;border-bottom:2px solid var(--line)}
.fhead{display:flex;justify-content:space-between;align-items:center}
.ftitle{font-family:var(--serif);font-size:1.15rem}
.fhide{border:1px solid var(--line);background:var(--paper2);border-radius:4px;padding:3px 9px;font-size:.72rem}
.fhide:hover{border-color:var(--accent)}
.fact{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.fclear{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:5px;padding:6px 10px;font-size:.78rem;font-weight:600}
.fclear:disabled{opacity:.35;cursor:default}
.fopt{padding:12px 2px 4px}
.fnon{font-size:.72rem;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.fon{color:var(--accent);font-weight:700}
body.eink .fclear{background:#fff;color:#000;border:2px solid #000}
body.eink .gn{background:#000;color:#fff}
.fgrp h4{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 5px;display:flex;justify-content:space-between;align-items:center}
.fgrp h4 button{border:none;background:none;color:var(--accent);font-size:.62rem;letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper2);border-radius:12px;padding:2px 8px;margin:2px 2px 2px 0;font-size:.72rem;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip em{font-style:normal;color:var(--faint);font-size:.66rem}
.chip.on em{color:var(--paper)}
.fstat{font-size:.75rem;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line2);margin-bottom:8px}
.main{grid-column:2;grid-row:2;position:relative;overflow:hidden;background:var(--paper)}
.side{grid-column:3;grid-row:2;width:420px;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side.off{display:none}
.shdr{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.crumbs{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;flex-wrap:wrap;gap:4px}
.crumbs a{cursor:pointer;text-decoration:none;color:var(--muted)}.crumbs a:hover{color:var(--accent)}
.ename{font-family:var(--serif);font-size:1.5rem;line-height:1.1;margin-bottom:3px}
.eab{font-size:.72rem;color:var(--muted);letter-spacing:.05em}
.eal{font-size:.74rem;color:var(--muted);font-style:italic;margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.nv{font-style:italic;font-size:.9em;border-bottom:1px dotted currentColor;color:var(--muted);white-space:normal}
body.eink .nv{color:#000;border-bottom:1px solid #000}
.bdg{font-size:.64rem;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--muted);background:var(--paper2)}
.bdg.cs-h{border-color:#2a5a30;color:#2a5a30}.bdg.cs-m{border-color:#8a6820;color:#8a6820}.bdg.cs-l{border-color:#8a3a3a;color:#8a3a3a}
body.dark .bdg.cs-h{color:#7fc08a;border-color:#7fc08a}body.dark .bdg.cs-m{color:#d2a957;border-color:#d2a957}body.dark .bdg.cs-l{color:#e08a8a;border-color:#e08a8a}
body.eink .bdg{color:#000;border-color:#000}
.bdg.org{border-style:dashed}
.sbody{overflow:auto;padding:12px 16px 24px;flex:1}
.fs{margin-bottom:14px}
.toc{display:none;gap:4px;overflow-x:auto;white-space:nowrap;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--paper2);scrollbar-width:thin}
.toc.on{display:flex}
.tocb{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:2px 10px;font-size:.72rem;color:var(--muted)}
.tocb:hover{border-color:var(--accent);color:var(--ink)}
.tocb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tocb.al{border-color:#b3261e;color:#b3261e;font-weight:600}.tocb.al.on{background:#b3261e;color:#fff}
body.dark .tocb.al{border-color:#ff8a80;color:#ff8a80}body.dark .tocb.al.on{background:#ff8a80;color:#150e06}
body.eink .tocb{border-color:#000;color:#000}body.eink .tocb.on,body.eink .tocb.al.on{background:#000;color:#fff}body.eink .tocb.al{border:2px solid #000;color:#000}
.fs.alarm{border:2px solid #b3261e;border-radius:6px;padding:8px 10px 6px;background:rgba(179,38,30,.06)}
.fs.alarm .fl{color:#b3261e;border-bottom-color:rgba(179,38,30,.35)}
body.dark .fs.alarm{border-color:#ff8a80;background:rgba(255,138,128,.08)}body.dark .fs.alarm .fl{color:#ff8a80}
body.eink .fs.alarm{border:3px double #000;background:#fff}body.eink .fs.alarm .fl{color:#000}
.fl{font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px;border-bottom:1px solid var(--line2);padding-bottom:2px}
.ft{font-size:.86rem;line-height:1.55}
.flist{padding-left:16px;font-size:.84rem;line-height:1.5}.flist li{margin-bottom:3px}
.ftx{font-size:.84rem;line-height:1.5;background:var(--paper2);border-left:3px solid var(--accent);padding:6px 9px}
.fnote{font-size:.83rem;line-height:1.5;font-style:italic;color:var(--muted);border-left:3px solid var(--line);padding:4px 9px}
.refs{padding-left:18px;font-size:.76rem;line-height:1.45;color:var(--ink)}.refs li{margin-bottom:4px}
.rels{display:flex;flex-direction:column;gap:6px}
.relg b{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.rchip{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:2px 8px;margin:2px 3px 2px 0;font-size:.74rem;cursor:pointer;background:var(--paper2)}
.rchip:hover{border-color:var(--accent);color:var(--accent)}
.sacts{display:flex;flex-wrap:wrap;gap:5px;padding:8px 16px;border-top:1px solid var(--line);background:var(--paper2)}
.sbtn{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 8px;font-size:.72rem}
.sbtn:hover{border-color:var(--accent)}
.sbig{display:flex;gap:8px;width:100%;margin-bottom:2px}
.sbtn.big{flex:1 1 200px;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px;border:1px solid var(--accent);background:var(--accent2);color:#1a1209;border-radius:7px;font-size:.8rem}
.sbtn.big svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sbtn.big span{display:flex;flex-direction:column;line-height:1.2}
.sbtn.big b{font-size:.88rem}.sbtn.big small{font-size:.68rem;opacity:.82}
.sbtn.big:hover{filter:brightness(1.07)}
.sbtn.big.in{background:var(--paper);color:var(--ink);border:2px solid var(--accent)}
.sbtn.big.alt{background:var(--ink);color:var(--paper);border-color:var(--ink)}
body.eink .sbtn.big{background:#fff;color:#000;border:2px solid #000}
body.eink .sbtn.big.in{background:#000;color:#fff}
body.dark .sbtn.big{color:#150e06}body.dark .sbtn.big.in{color:var(--ink)}
.home{padding:16px 16px 24px}
.hhead h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;color:var(--ink)}.hhead h3 i{color:var(--accent)}
.hhead p{color:var(--muted);font-size:.8rem;margin:2px 0 12px}
.hsec{margin-bottom:14px}.hsec h4{font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;border-bottom:1px solid var(--line2);padding-bottom:2px}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hcard{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--paper2);border-radius:7px;padding:9px 11px}
.hcard:hover{border-color:var(--accent);background:var(--paper)}
.hcard b{font-size:.86rem;color:var(--ink)}.hcard small{font-size:.7rem;color:var(--muted)}
body.eink .hcard{border:2px solid #000;background:#fff}
.hnote{color:var(--muted);font-size:.76rem;line-height:1.55;margin-top:6px}
.hnote kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--paper2)}
.empty{padding:20px 16px;color:var(--muted);font-size:.86rem;line-height:1.6}
.empty h3{font-family:var(--serif);font-weight:400;font-size:1.3rem;color:var(--ink);margin-bottom:6px}
.empty kbd,.help kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:.75rem;background:var(--paper2)}
/* ---------- SVG ---------- */
svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.map.drag{cursor:grabbing}
.secbg{opacity:.06}
body.eink .secbg{opacity:0}
.ringc{fill:none;stroke:var(--line);stroke-width:.7;stroke-dasharray:2 5}
.axis{stroke:var(--line);stroke-width:.5}
.seclbl{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ringlbl{font-size:7px;fill:var(--muted);font-weight:700}
.nd{cursor:pointer;transition:opacity .15s}
.nd .sh{stroke-width:1}
.nd.cs-h .sh{fill-opacity:1}
.nd.cs-m .sh{fill-opacity:.55}
.nd.cs-l .sh{fill:var(--paper)!important;stroke-width:1.3}
body.eink .nd .sh{fill:#000!important;stroke:#000!important}
body.eink .nd.cs-m .sh{fill:#888!important}
body.eink .nd.cs-l .sh{fill:#fff!important}
.nd .lbl{font-size:7px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:2.2px;stroke-linejoin:round}
.nd .halo{fill:none;stroke:var(--sel);stroke-width:1.6;opacity:0}
.nd.sel .halo{opacity:1}
.nd.match .halo{opacity:.7;stroke:var(--accent);stroke-dasharray:2 1.5}
.nd.dim{opacity:var(--dim)}
.nd.hide{display:none}
.nd.rel .halo{opacity:.85;stroke:var(--accent2);stroke-width:1}
.wring{fill:none;stroke-dasharray:1.5 1.5;stroke-width:.8;opacity:.8}
.edge{fill:none;stroke-width:.9;opacity:.6;pointer-events:none}
.center-t{font-family:var(--serif);font-size:15px;fill:var(--ink);text-anchor:middle}
.center-s{font-size:7px;fill:var(--muted);text-anchor:middle;letter-spacing:.05em}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:5}
.zoomctl .lblbtn{width:auto;height:auto;padding:6px 10px;font-size:.74rem;font-weight:600;white-space:nowrap;align-self:flex-end;margin-bottom:4px}
.zoomctl .lblbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
body.eink .zoomctl .lblbtn{border:2px solid #000}body.eink .zoomctl .lblbtn.on{background:#000;color:#fff}
.zoomctl button{width:30px;height:30px;border:1px solid var(--line);background:var(--paper);border-radius:4px;font-size:1rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.viewinfo{position:absolute;left:12px;top:10px;font-size:.72rem;color:var(--muted);z-index:4;max-width:60%;pointer-events:none}
.viewinfo b{font-family:var(--serif);font-size:1.1rem;color:var(--ink);font-weight:400;display:block}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.75rem;padding:5px 8px;border-radius:4px;z-index:100;opacity:0;max-width:300px;line-height:1.35}
/* ---------- índice ---------- */
.idx{position:absolute;inset:0;overflow:auto;padding:10px 14px}
.idx table{border-collapse:collapse;width:100%;font-size:.78rem}
.idx th{position:sticky;top:0;background:var(--paper2);text-align:left;padding:6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.idx td{padding:5px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.idx tr:hover td{background:var(--paper2);cursor:pointer}
.idx tr.sel td{background:rgba(200,16,46,.08)}
.idxbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex}
.cmpw{overflow:auto;max-height:70vh}.cmpt{border-collapse:collapse;font-size:.8rem;min-width:100%}.cmpt th,.cmpt td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}.cmpt th{background:var(--paper2);font-size:.72rem}.cmpt td{min-width:180px}
.tourbar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:150;background:var(--paper);border:1px solid var(--ink);border-radius:8px;padding:8px 12px;display:none;gap:8px;align-items:center;max-width:min(900px,94vw);box-shadow:var(--shadow);font-size:.82rem;flex-wrap:wrap}.tourbar.on{display:flex}.tnote{flex:1;min-width:200px;color:var(--muted)}
.rleg{font-size:.7rem;color:var(--muted);margin:2px 0 4px}
.figcap{font-size:.8rem;line-height:1.45;margin:8px 0 4px}
.figrefs{font-size:.72rem;color:var(--muted);margin:4px 0 0;padding-left:18px}
.figrefs li{margin:2px 0}
.figgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:8px 0 14px}
.figcard{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:6px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.figcard:hover{border-color:var(--accent)}
.figthumb{height:130px;overflow:hidden;border:1px solid var(--line);background:#fff;margin-bottom:6px;pointer-events:none}
.figthumb svg{display:block;width:100%;height:auto}
.figcard b{display:block;font-size:.78rem;line-height:1.25}

<script>
(function(){
'use strict';
const CFG=window.ATLAS_CFG, DATA=window.ATLAS_DATA;
const NODES=DATA.nodes, BY={};NODES.forEach(n=>BY[n.id]=n);
const VIEWS=CFG.VIEWS;const VORDER=['nos','sem','eti','ter','hist','idx'];
const VT={nos:'Nosología',sem:'Semiología',eti:'Etiopatogenia',ter:'Terapéutica',hist:'Historia',idx:'Índice'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NVRE=/\[(?:fuente(?: oficial)? no localizada|no verificada)[^\]]*\]/g;
const escx=s=>esc(s).replace(NVRE,m=>'<span class="nv" title="No se localizó una fuente oficial o primaria que respalde este dato. Se conserva a título informativo: contrástelo antes de usarlo.">'+m+'</span>');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const SVGNS='http://www.w3.org/2000/svg';
function el(tag,attrs,par){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(par)par.appendChild(e);return e;}
const store={get(k,d){try{const v=localStorage.getItem('atlas2.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('atlas2.'+k,JSON.stringify(v));}catch(e){}}};
function secOf(n){const v=VIEWS[n.vw];return v?v.sectors.find(s=>s.id===n.sp):null;}
function colOf(n){const s=secOf(n);return s?s.c:'#8a6820';}
// índice de búsqueda
NODES.forEach(n=>{n._s=norm([n.n,n.ab,(n.al||[]).join(' '),(n.cie||[]).join(' ')].join(' '));n._t=norm([n.desc,(n.feats||[]).join(' '),n.note,n.tx,(n.sec||[]).map(s=>s.x).join(' ')].join(' '));n._r=norm((n.refs||[]).join(' '));});

// ---------------- estado ----------------
const st={view:store.get('view','nos'),sel:null,hist:[],hpos:-1,q:'',f:{sp:new Set(),ring:new Set(),k:new Set(),trad:new Set(),cs:new Set(),tags:new Set(),origen:new Set(),ev:new Set()},hideNon:false,fopen:new Set(store.get('fopen',['sp','k'])),allLbl:!!store.get('allLbl',0),theme:store.get('theme','light')};
if(!VORDER.includes(st.view))st.view='nos';

// ---------------- filtros ----------------
function matchQ(n,q){if(!q)return 0;let sc=0;const qs=q.split(/\s+/).filter(Boolean);
  for(const w of qs){if(n._s.includes(w))sc+=n._s.startsWith(w)?6:4;else if(n._t.includes(w))sc+=1.2;else if(n._r.includes(w))sc+=1;else return 0;}return sc;}
function passes(n){const f=st.f;
  if(f.sp.size&&!f.sp.has(n.sp))return false;
  if(f.ring.size&&!f.ring.has(String(n.ring)))return false;
  if(f.k.size&&!f.k.has(n.k))return false;
  if(f.trad.size&&!f.trad.has(n.trad))return false;
  if(f.cs.size&&!f.cs.has(n.cs))return false;
  if(f.ev.size&&!f.ev.has(n.ev))return false;
  if(f.origen.size&&!f.origen.has(n.origen||'v1'))return false;
  if(f.tags.size&&!(n.tags||[]).some(t=>f.tags.has(t)))return false;
  if(st.q.length>1&&!matchQ(n,norm(st.q)))return false;
  return true;}
function anyFilter(){const f=st.f;return st.q.length>1||Object.values(f).some(s=>s.size);}
function viewNodes(v){return v==='idx'?NODES:v==='hist'?NODES.filter(n=>n.y!=null):NODES.filter(n=>n.vw===v);}
function renderFilters(){
  const box=$('#filters');const v=st.view;const pool=viewNodes(v);
  const cnt=(key,val)=>pool.filter(n=>key==='tags'?(n.tags||[]).includes(val):String(n[key]==null?(key==='origen'?'v1':''):n[key])===val).length;
  let h='<div class="fsticky"><div class="fhead"><div class="ftitle">Filtros</div><button class="fhide" id="fHide" title="Ocultar el panel y ampliar el mapa">Ocultar ✕</button></div>'+
    '<div class="fstat" id="fstat"></div>'+
    '<div class="fact"><button class="fclear" id="clrAll"'+(anyFilter()?'':' disabled')+'>Limpiar todos los filtros</button></div></div>';
  const opened=st.fopen;
  const grp=(title,key,items)=>{if(!items.length)return '';const act=st.f[key].size;
    h+='<details class="fgrp" data-g="'+key+'"'+(opened.has(key)||act?' open':'')+'><summary><span class="gt">'+title+'</span>'+(act?'<span class="gn">'+act+'</span>':'')+'</summary><div class="chips">';
    items.forEach(([val,lab,col])=>{const c=cnt(key,val);if(!c&&!st.f[key].has(val))return;h+='<span class="chip'+(st.f[key].has(val)?' on':'')+'" data-k="'+key+'" data-v="'+esc(val)+'">'+(col?'<span class="sw" style="background:'+col+'"></span>':'')+esc(lab)+' <em>'+c+'</em></span>';});
    h+=(act?'<button class="gclr" data-clr="'+key+'">Quitar esta selección</button>':'')+'</div></details>';};
  if(VIEWS[v])grp('Sector','sp',VIEWS[v].sectors.map(s=>[s.id,s.t,s.c]));
  grp('Tipo de nodo','k',Object.entries(CFG.KINDS).map(([k,o])=>[k,o.t]));
  grp('Etiquetas clínicas','tags',Object.entries(CFG.TAGS).map(([k,t])=>[k,t]));
  if(VIEWS[v])grp('Anillo','ring',VIEWS[v].rings.map((r,i)=>[String(i+1),(i+1)+'. '+r]));
  grp('Evidencia predominante','ev',Object.entries(CFG.EV).map(([k,t])=>[k,t]));
  grp('Consenso','cs',Object.entries(CFG.CS).map(([k,t])=>[k,t]));
  grp('Tradición / escuela','trad',Object.entries(CFG.TRADS).map(([k,t])=>[k,t]));
  h+='<div class="fopt"><label class="fnon"><input type="checkbox" id="hideNon"'+(st.hideNon?' checked':'')+'> Ocultar (no solo atenuar) lo que no coincide con los filtros</label></div>';
  box.innerHTML=h;updateStat();
}
$('#filters').addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.fgrp')){d.open?st.fopen.add(d.dataset.g):st.fopen.delete(d.dataset.g);store.set('fopen',[...st.fopen]);}},true);
$('#filters').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){const s=st.f[c.dataset.k];s.has(c.dataset.v)?s.delete(c.dataset.v):s.add(c.dataset.v);applyFilters();renderFilters();return;}
  const b=e.target.closest('[data-clr]');if(b){st.f[b.dataset.clr].clear();applyFilters();renderFilters();return;}
  if(e.target.id==='fHide'){setFilt(false);return;}
  if(e.target.id==='clrAll'){Object.values(st.f).forEach(s=>s.clear());st.q='';$('#q').value='';applyFilters();renderFilters();}});
$('#filters').addEventListener('change',e=>{if(e.target.id==='hideNon'){st.hideNon=e.target.checked;applyFilters();}});
function updFiltBadge(){const n=Object.values(st.f).reduce((a,x)=>a+x.size,0);const b=$('#filtN');if(b){b.hidden=!n;b.textContent=n;}$('#bFilt').title=n?'Panel de filtros: '+n+' activos':'Mostrar u ocultar el panel de filtros';}
function updateStat(){updFiltBadge();const pool=viewNodes(st.view);const vis=pool.filter(passes).length;const fs=$('#fstat');if(fs)fs.innerHTML='<b>'+vis+'</b> de '+pool.length+' nodos visibles en esta vista'+(anyFilter()?' · <span class="fon">filtros activos</span>':'');const c=$('#clrAll');if(c)c.disabled=!anyFilter();}

// ---------------- vistas radiales ----------------
const R0=112,R1=440;const RADIAL={};
function polar(r,a){const t=a*Math.PI/180;return [r*Math.sin(t),-r*Math.cos(t)];}
function arc(r0,r1,a0,a1){const L=(a1-a0)>180?1:0;const p1=polar(r1,a0),p2=polar(r1,a1),p3=polar(r0,a1),p4=polar(r0,a0);
  return 'M'+p1+' A'+r1+','+r1+' 0 '+L+' 1 '+p2+' L'+p3+' A'+r0+','+r0+' 0 '+L+' 0 '+p4+'Z';}
function shapePath(sh,r){switch(sh){
  case 'square':return 'M'+(-r*.88)+','+(-r*.88)+'h'+(r*1.76)+'v'+(r*1.76)+'h'+(-r*1.76)+'z';
  case 'diamond':return 'M0,'+(-r*1.2)+'L'+(r*1.2)+',0L0,'+(r*1.2)+'L'+(-r*1.2)+',0z';
  case 'triangle':return 'M0,'+(-r*1.2)+'L'+(r*1.1)+','+(r*.8)+'L'+(-r*1.1)+','+(r*.8)+'z';
  case 'hex':{let d='';for(let i=0;i<6;i++){const a=Math.PI/3*i;d+=(i?'L':'M')+(r*1.1*Math.cos(a)).toFixed(2)+','+(r*1.1*Math.sin(a)).toFixed(2);}return d+'z';}
  case 'star':{let d='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.5:r*1.3;d+=(i?'L':'M')+(rr*Math.cos(a)).toFixed(2)+','+(rr*Math.sin(a)).toFixed(2);}return d+'z';}
  default:return 'M'+(-r)+',0a'+r+','+r+' 0 1,0 '+(2*r)+',0a'+r+','+r+' 0 1,0 '+(-2*r)+',0';}}
const RAD={h:4.4,m:3.5,l:2.9};
function layout(v){const V=VIEWS[v];const ns=NODES.filter(n=>n.vw===v);const nr=V.rings.length,bw=(R1-R0)/nr;
  const cnt={};V.sectors.forEach(s=>cnt[s.id]=ns.filter(n=>n.sp===s.id).length);
  // peso: nodos en el anillo más poblado del sector (lo que limita el espacio) mezclado con el total
  const need={};V.sectors.forEach(s=>{let mx=0;for(let r=1;r<=nr;r++)mx=Math.max(mx,ns.filter(n=>n.sp===s.id&&n.ring===r).length);need[s.id]=Math.max(3,mx*0.75+cnt[s.id]*0.25);});
  const tot=V.sectors.reduce((a,s)=>a+need[s.id],0);const gap=1.2;const avail=360-gap*V.sectors.length;
  let a=-((need[V.sectors[0].id]/tot)*avail)/2;const secs=[];

// ---------------- menciones transversales, comparador y recorridos ----------------
const CMP=[];
function mentions(n){if(n._men)return n._men;const keys=[n.n.split(/[(/]/)[0].trim()].concat((n.al||[]).slice(0,3)).map(norm).filter(k=>k.length>=6);
  const rel=new Set(n.rel||[]);n._men=keys.length?NODES.filter(m=>m!==n&&!rel.has(m.id)&&keys.some(k=>m._t.includes(k))):[];return n._men;}
function showCompare(){if(!CMP.length){modal('<h2>Comparador</h2><p>Añade entre 2 y 4 nodos con el botón «Añadir a comparación» de cada ficha.</p>');return;}
  const ns=CMP.map(i=>BY[i]).filter(Boolean);const row=(lab,f)=>'<tr><th>'+lab+'</th>'+ns.map(n=>'<td>'+f(n)+'</td>').join('')+'</tr>';
  const shared=ns.length>1?(ns[0].rel||[]).filter(r=>ns.every(n=>(n.rel||[]).includes(r))):[];
  let h='<h2>Comparador</h2><div class="cmpw"><table class="cmpt"><tr><th></th>'+ns.map(n=>'<th><span class="rchip" data-id="'+n.id+'" style="border-left:3px solid '+colOf(n)+'">'+esc(n.n)+'</span></th>').join('')+'</tr>'+
   row('Vista / sector',n=>esc(VT[n.vw]+' · '+((secOf(n)||{}).t||'')))+row('Tipo',n=>esc((CFG.KINDS[n.k]||{}).t||''))+row('Tradición',n=>esc(CFG.TRADS[n.trad]||''))+row('Consenso',n=>esc(CFG.CS[n.cs]||''))+row('Evidencia',n=>esc(CFG.EV[n.ev]||''))+row('CIE-11',n=>esc((n.cie||[]).join(', ')))+row('Año',n=>n.y==null?'':n.y)+
   row('Descripción',n=>escx(n.desc||''))+row('Rasgos clave',n=>'<ul class="flist">'+(n.feats||[]).map(f=>'<li>'+escx(f)+'</li>').join('')+'</ul>')+row('Tratamiento',n=>escx(n.tx||''))+row('Nota crítica',n=>escx(n.note||''))+row('Referencias',n=>(n.refs||[]).length+' ('+(n.refs||[]).filter(r=>/PMID|doi:/i.test(r)).length+' verificadas)')+
   '</table></div>'+(shared.length?'<h3>Relaciones compartidas por todos</h3><div class="rels">'+shared.map(i=>BY[i]?'<span class="rchip" data-id="'+i+'">'+esc(BY[i].n)+'</span>':'').join('')+'</div>':'')+'<p style="margin-top:10px"><button class="sbtn" id="cmpClr">Vaciar comparación</button></p>';
  modal(h,true);}
let TOUR=null;
function showTours(){const T=CFG.TOURS||[];
  const wkl=DATA.wklTree?'<div class="hubsec"><div class="hubh"><span class="hubn">A</span><div><b>Encontrar una forma WKL</b><small>Árbol de decisión (Wernicke-Kleist-Leonhard): respondes por curso longitudinal, polaridad y dominio psicopatológico y llegas a las formas compatibles. Herramienta docente.</small></div></div><button class="wko hubgo" data-wk="root"><b>Empezar la guía de trayectorias WKL ▸</b><br><span style="font-size:.78rem;color:var(--muted)">Pocas preguntas; puedes volver atrás en cualquier paso</span></button></div>':'';
  modal('<h2>Recorridos</h2><p class="wkh">Dos formas de dejarse guiar por el atlas.</p>'+wkl+
  '<div class="hubsec"><div class="hubh"><span class="hubn">'+(wkl?'B':'A')+'</span><div><b>Seguir un itinerario</b><small>Secuencia docente que recorre nodos de distintas vistas. Avanzas con la barra inferior o con las teclas [ y ].</small></div></div>'+T.map((t,i)=>'<button class="wko" data-tour="'+i+'"><b>'+esc(t.t)+'</b><br><span style="font-size:.78rem;color:var(--muted)">'+esc(t.d)+' · '+t.s.length+' pasos</span></button>').join('')+'</div>');}
function tourGo(i){const T=CFG.TOURS[TOUR.t];TOUR.i=Math.max(0,Math.min(T.s.length-1,i));const s=T.s[TOUR.i];const n=BY[s[0]];if(n){if(st.view!==n.vw&&n.vw!=='hist')showView(n.vw);select(n.id);if(n.vw!=='hist')focusNode(n.vw,n.id);}
  $('#tourbar').innerHTML='<b>'+esc(T.t)+'</b> · paso '+(TOUR.i+1)+'/'+T.s.length+'<span class="tnote">'+esc(s[1])+'</span><button class="sbtn" data-tg="-1"'+(TOUR.i?'':' disabled')+'>◂</button><button class="sbtn" data-tg="1"'+(TOUR.i<T.s.length-1?'':' disabled')+'>▸</button><button class="sbtn" data-tg="x">Salir</button>';$('#tourbar').classList.add('on');}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tour]');if(t){$('#modal').classList.remove('on');TOUR={t:+t.dataset.tour,i:0};tourGo(0);return;}

// ---------------- fase 3: mapa local de relaciones ----------------
let ADJ=null;
function adjOf(){if(ADJ)return ADJ;ADJ={};NODES.forEach(n=>(n.rel||[]).forEach(r=>{if(!BY[r])return;(ADJ[n.id]=ADJ[n.id]||new Set()).add(r);(ADJ[r]=ADJ[r]||new Set()).add(n.id);}));return ADJ;}
const RM={id:null,d:2};
function relMapBody(cid,depth){
  const A=adjOf(),c=BY[cid],deg=i=>(A[i]||{size:0}).size;
  const all1=[...(A[cid]||[])].map(i=>BY[i]).sort((a,b)=>deg(b.id)-deg(a.id)||a.n.localeCompare(b.n,'es'));
  const n1=all1.slice(0,24);const s1=new Set(n1.map(m=>m.id));let n2=[],all2=[];
  if(depth>=2){const cnt={};n1.forEach(m=>(A[m.id]||[]).forEach(i=>{if(i!==cid&&!s1.has(i))cnt[i]=(cnt[i]||0)+1;}));
    all2=Object.keys(cnt).map(i=>BY[i]).sort((a,b)=>cnt[b.id]-cnt[a.id]||deg(b.id)-deg(a.id)||a.n.localeCompare(b.n,'es'));n2=all2.slice(0,36);}
  const R1=depth>=2?165:190,R2=340,RR=depth>=2?540:400;
  const ord=VORDER.filter(v=>v!=='idx');n1.sort((a,b)=>ord.indexOf(a.vw)-ord.indexOf(b.vw)||a.n.localeCompare(b.n,'es'));
  const ang1={};n1.forEach((m,i)=>ang1[m.id]=-Math.PI/2+2*Math.PI*i/Math.max(1,n1.length));
  const mean=m=>{let sx=0,sy=0;(A[m.id]||[]).forEach(i=>{if(ang1[i]!=null){sx+=Math.cos(ang1[i]);sy+=Math.sin(ang1[i]);}});return Math.atan2(sy,sx);};
  const norm2=a=>(a+Math.PI/2+4*Math.PI)%(2*Math.PI);
  n2.sort((a,b)=>norm2(mean(a))-norm2(mean(b)));const ang2={};n2.forEach((m,i)=>ang2[m.id]=-Math.PI/2+2*Math.PI*(i+.5)/Math.max(1,n2.length));
  const pos={};pos[cid]=[0,0];n1.forEach(m=>pos[m.id]=[R1*Math.cos(ang1[m.id]),R1*Math.sin(ang1[m.id])]);n2.forEach(m=>pos[m.id]=[R2*Math.cos(ang2[m.id]),R2*Math.sin(ang2[m.id])]);
  let g='';
  n2.forEach(m=>(A[m.id]||[]).forEach(i=>{if(s1.has(i))g+='<line class="e2" x1="'+pos[i][0].toFixed(1)+'" y1="'+pos[i][1].toFixed(1)+'" x2="'+pos[m.id][0].toFixed(1)+'" y2="'+pos[m.id][1].toFixed(1)+'"/>';}));
  n1.forEach(m=>g+='<line class="e1" x1="0" y1="0" x2="'+pos[m.id][0].toFixed(1)+'" y2="'+pos[m.id][1].toFixed(1)+'"/>');
  const lab=(m,a,r,fs,max)=>{const t=m.n.length>max?m.n.slice(0,max-1)+'…':m.n;const deg=a*180/Math.PI;const left=Math.cos(a)<0;const x=(r)*Math.cos(a),y=(r)*Math.sin(a);
    return '<text transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(left?deg+180:deg).toFixed(1)+')" x="'+(left?-1:1)*(fs>11?13:10)+'" y="'+(fs*.35).toFixed(1)+'" text-anchor="'+(left?'end':'start')+'" font-size="'+fs+'">'+esc(t)+'</text>';};
  const node=(m,r,a,rad,fs,max)=>'<g class="rn" tabindex="0" role="button" data-rm="'+m.id+'" aria-label="'+esc(m.n)+' ('+esc(VT[m.vw])+')"><title>'+esc(m.n)+' · '+esc(VT[m.vw])+'</title><g transform="translate('+pos[m.id][0].toFixed(1)+' '+pos[m.id][1].toFixed(1)+')"><path d="'+shapePath((CFG.KINDS[m.k]||{}).sh,r)+'" fill="'+colOf(m)+'" stroke="var(--ink)" stroke-width="1.6"/></g>'+(a==null?'':lab(m,a,rad,fs,max))+'</g>';
  n2.forEach(m=>g+=node(m,6.5,ang2[m.id],R2+9,12.5,26));
  n1.forEach(m=>g+=node(m,9,ang1[m.id],R1+11,13,22));
  g+='<g class="rn" tabindex="0" role="button" data-rm="'+cid+'"><title>'+esc(c.n)+'</title><g><path d="'+shapePath((CFG.KINDS[c.k]||{}).sh,17)+'" fill="'+colOf(c)+'" stroke="var(--ink)" stroke-width="3"/></g><text x="0" y="'+(depth>=2?-28:-30)+'" text-anchor="middle" font-size="15" font-weight="700">'+esc(c.n.length>34?c.n.slice(0,33)+'…':c.n)+'</text></g>';
  const seenK={};[c].concat(n1,n2).forEach(m=>seenK[m.k]=1);const legend=Object.keys(CFG.KINDS).filter(k=>seenK[k]).map(k=>'<span><svg viewBox="-12 -12 24 24"><path d="'+shapePath(CFG.KINDS[k].sh,8)+'" fill="none" stroke="currentColor" stroke-width="2"/></svg>'+esc(CFG.KINDS[k].t)+'</span>').join('');
  return {svg:'<svg class="rmsvg" viewBox="'+(-RR)+' '+(-RR)+' '+(2*RR)+' '+(2*RR)+'" role="img" aria-label="Mapa de relaciones de '+esc(c.n)+'">'+g+'</svg>',
    legend,n1:all1.length,s1:n1.length,n2:all2.length,s2:n2.length};}
function showRelMap(id,depth){RM.id=id;RM.d=depth;RM.z=1;const c=BY[id];if(!c)return;const b=relMapBody(id,depth);
  modal('<div class="rmw"><div class="rmtop"><span class="rmt" style="color:'+colOf(c)+'">'+esc(c.n)+'</span>'+
   '<button class="sbtn'+(depth===1?' in':'')+'" data-rmd="1"'+(depth===1?' aria-pressed="true"':'')+'>1 paso</button><button class="sbtn'+(depth===2?' in':'')+'" data-rmd="2"'+(depth===2?' aria-pressed="true"':'')+'>2 pasos</button>'+
   '<button class="sbtn" data-rmz="-1" aria-label="Alejar">−</button><button class="sbtn" data-rmz="1" aria-label="Acercar">＋</button><button class="sbtn" data-id="'+id+'">Abrir ficha</button></div><div class="rmwrap" id="rmwrap">'+b.svg+'</div>'+
   '<div class="rmleg"><span><b>Forma = tipo de nodo:</b></span>'+b.legend+'<span>Color = sector (como en el mapa principal) · línea continua: relación directa · discontinua: vecino de un vecino</span></div>'+
   '<div class="rmnote">Vecinos directos: '+b.n1+(b.n1>b.s1?' (se muestran los '+b.s1+' más conectados)':'')+(depth>=2?' · a 2 pasos: '+b.n2+(b.n2>b.s2?' (se muestran los '+b.s2+' más enlazados con el primer anillo)':''):'')+'. Haz clic en un nodo para recentrar el mapa; «Abrir ficha» lleva a la ficha del nodo central. Las relaciones del atlas son asociativas (comparten síntomas, mecanismos, diferencial o tratamiento): no implican causalidad ni criterio diagnóstico.</div></div>',true);}
$('#mbox').addEventListener('click',e=>{const z=e.target.closest('[data-rmz]');if(z){const sv=$('#rmwrap .rmsvg');if(sv){RM.z=Math.max(1,Math.min(3,(RM.z||1)+.5*(+z.dataset.rmz)));sv.style.setProperty('--z',RM.z);}return;}const r=e.target.closest('[data-rm]');if(r){showRelMap(r.dataset.rm,RM.d);return;}const d=e.target.closest('[data-rmd]');if(d)showRelMap(RM.id,+d.dataset.rmd);});
$('#mbox').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-rm]')){e.preventDefault();showRelMap(e.target.dataset.rm,RM.d);}});

// ---------------- fase 3: búsqueda por síntomas combinados ----------------
const SYM={items:[],scope:'nos'};
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function symTerms(n){return [n.n.split(/[(/]/)[0].trim()].concat(n.al||[]).flatMap(t=>[t].concat(t.split(/\s*,\s*|\s+(?:y|e|o)\s+|\s*\/\s*/).filter(x=>x.length>=5))).map(norm).map(x=>x.replace(/\s+/g,' ').trim()).filter((k,i,a)=>k.length>=4&&a.indexOf(k)===i);}
function symAdd(it){if(it.id){if(SYM.items.some(x=>x.id===it.id))return;const n=BY[it.id];if(!n)return;SYM.items.push({id:n.id,label:n.n.split(/[(/]/)[0].trim(),terms:symTerms(n)});}
  else{const t=norm(it.label).trim();if(t.length<3||SYM.items.some(x=>!x.id&&x.terms[0]===t))return;SYM.items.push({label:it.label.trim(),terms:[t]});}
  updSymBadge();}
function updSymBadge(){const b=$('#symN');b.textContent=SYM.items.length;b.hidden=!SYM.items.length;}
function symHas(txt,k){if(k.length<5)return new RegExp('(^|[^a-z0-9])'+escRe(k)+'($|[^a-z0-9])').test(txt);return txt.includes(k);}
function symField(n){if(n._sf)return n._sf;n._sf={f:norm((n.feats||[]).join(' | ')),d:norm(n.desc||''),s:norm((n.sec||[]).map(s=>s.x).join(' '))};return n._sf;}
function symRank(){const A=adjOf(),items=SYM.items;if(!items.length)return [];const res=[];
  for(const e of NODES){if(SYM.scope==='nos'?e.vw!=='nos':e.vw==='hist')continue;let sc=0,hit=0;const det=[];
    for(const it of items){if(it.id===e.id)continue;let t=0,how='';
      if(it.id&&A[e.id]&&A[e.id].has(it.id)){t=1;how='relación directa en el atlas';}
      else{const F=symField(e);const has=f=>it.terms.some(k=>symHas(F[f],k));
        if(has('f')){t=.8;how='rasgos clave';}else if(has('d')){t=.6;how='descripción';}else if(has('s')){t=.3;how='otras secciones';}}
      if(t){sc+=t;hit++;det.push([it,how,t]);}}
    if(hit)res.push({e,sc,hit,det});}
  res.sort((a,b)=>b.hit-a.hit||b.sc-a.sc||a.e.n.localeCompare(b.e.n,'es'));return res;}
function symSugg(q){const nq=norm(q).trim();if(nq.length<2)return [];const have=new Set(SYM.items.map(x=>x.id));
  return NODES.filter(n=>n.vw==='sem'&&n.k==='sx'&&!have.has(n.id)&&n._s.includes(nq)).sort((a,b)=>(a._s.indexOf(nq)-b._s.indexOf(nq))||a.n.localeCompare(b.n,'es')).slice(0,8);}
function symRender(){const box=$('#symres');if(!box)return;
  $('#symchips').innerHTML=SYM.items.length?SYM.items.map((x,i)=>'<span class="symchip'+(x.id?'':' free')+'">'+esc(x.label)+(x.id?'':' <small>(texto libre)</small>')+'<button data-symx="'+i+'" aria-label="Quitar '+esc(x.label)+'">×</button></span>').join(''):'<small style="color:var(--muted)">Aún no hay síntomas. Escribe arriba (p. ej. «anhedonia», «alucinaciones», «hipervigilancia») y pulsa Intro.</small>';
  const R=symRank(),N=SYM.items.length;
  if(!N){box.innerHTML='';}
  else if(!R.length){box.innerHTML='<p>Sin coincidencias con los términos marcados.</p>';}
  else{const full=R.filter(r=>r.hit===N).length;const top=R.slice(0,60);
    box.innerHTML='<div class="rmnote">'+R.length+' resultado(s)'+(N>1?'; '+full+' reúne(n) los '+N+' síntomas':'')+(R.length>60?' (se muestran 60)':'')+'.</div>'+top.map(r=>'<div class="symr"><div class="rh"><span class="rchip" data-id="'+r.e.id+'" style="border-left:3px solid '+colOf(r.e)+'">'+esc(r.e.n)+'</span><small>'+esc(VT[r.e.vw])+' · '+esc((CFG.KINDS[r.e.k]||{}).t||'')+'</small><span class="sc">'+r.hit+'/'+N+' síntomas · puntuación '+r.sc.toFixed(1)+'</span></div><div class="bar"><i style="width:'+Math.round(100*r.sc/N)+'%"></i></div><div class="mt">'+r.det.map(d=>'<b>'+esc(d[0].label)+'</b>: '+d[1]).join(' · ')+'</div></div>').join('');}}
function showSym(){modal('<div class="sym"><h2>Búsqueda por síntomas combinados</h2>'+
  '<div class="symwarn">Herramienta de exploración docente. Cruza los síntomas que marques con el texto y las relaciones del atlas; la coincidencia es léxica y no distingue si una ficha afirma o niega el síntoma. No es un instrumento diagnóstico: el diagnóstico exige evaluación clínica, curso, contexto y criterios de DSM-5-TR o CIE-11.</div>'+
  '<div class="symin"><input id="symq" type="search" autocomplete="off" placeholder="Añadir síntoma: escribe y elige, o pulsa Intro para usar el texto tal cual" aria-label="Añadir síntoma"><div class="symsug" id="symsug" role="listbox"></div></div>'+
  '<div class="symchips" id="symchips"></div>'+
  '<div class="symopts"><span>Buscar en:</span><label><input type="radio" name="symsc" value="nos"'+(SYM.scope==='nos'?' checked':'')+'> Entidades (nosología)</label><label><input type="radio" name="symsc" value="all"'+(SYM.scope==='all'?' checked':'')+'> Todas las vistas</label><button class="sbtn" id="symclr">Vaciar</button></div>'+
  '<div class="rmnote">Puntuación por síntoma: relación directa en el atlas 1,0 · rasgos clave 0,8 · descripción 0,6 · otras secciones 0,3 (se toma la mejor coincidencia). Orden: primero las entidades que reúnen más síntomas.</div>'+
  '<div class="symres" id="symres"></div></div>',true);
  symRender();const inp=$('#symq');setTimeout(()=>inp.focus(),30);}
document.addEventListener('input',e=>{if(e.target.id!=='symq')return;const sg=symSugg(e.target.value);const box=$('#symsug');
  box.innerHTML=sg.map((n,i)=>'<button data-sa="'+n.id+'" class="'+(i?'':'act')+'">'+esc(n.n)+(n.ab?'<small>'+esc(n.ab)+'</small>':'')+'</button>').join('')+(e.target.value.trim().length>=3?'<button data-sf="1"'+(sg.length?'':' class="act"')+'>Usar «'+esc(e.target.value.trim())+'» como texto libre</button>':'');box.classList.toggle('on',!!box.innerHTML);});
document.addEventListener('keydown',e=>{if(e.target.id!=='symq')return;const box=$('#symsug');const bs=[...box.querySelectorAll('button')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!bs.length)return;let i=bs.findIndex(b=>b.classList.contains('act'));bs.forEach(b=>b.classList.remove('act'));i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[i].classList.add('act');bs[i].scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'){e.preventDefault();const a=box.querySelector('button.act')||box.querySelector('button');const v=e.target.value.trim();if(a)a.click();else if(v.length>=3){symAdd({label:v});e.target.value='';box.classList.remove('on');symRender();}}
  else if(e.key==='Escape'&&box.classList.contains('on')){e.stopPropagation();box.classList.remove('on');}});
$('#mbox').addEventListener('click',e=>{const sa=e.target.closest('[data-sa]');const sf=e.target.closest('[data-sf]');const sx=e.target.closest('[data-symx]');const inp=$('#symq');
  if(sa){symAdd({id:sa.dataset.sa});inp.value='';$('#symsug').classList.remove('on');symRender();inp.focus();}
  else if(sf){const v=inp.value.trim();if(v.length>=3){symAdd({label:v});}inp.value='';$('#symsug').classList.remove('on');symRender();inp.focus();}
  else if(sx){SYM.items.splice(+sx.dataset.symx,1);updSymBadge();symRender();}
  else if(e.target.id==='symclr'){SYM.items.length=0;updSymBadge();symRender();}
  else if(e.target.name==='symsc'){SYM.scope=e.target.value;symRender();}});
$('#bSym').onclick=showSym;

// ---------------- modales ----------------
function modal(h,wide){$('#mbox').innerHTML='<button class="mclose" aria-label="Cerrar">×</button>'+h;$('#mbox').classList.toggle('wide',!!wide);$('#modal').classList.add('on');}
const FIG=window.ATLAS_FIG||{},FIGM=window.ATLAS_FIGMETA||{};let figZ=100;
const FIGK={dd:'Diagnóstico diferencial',circ:'Circuito',mat:'Matriz',mod:'Modelo'};
function figsOf(id){return Object.keys(FIGM).filter(k=>(FIGM[k].nodes||[]).includes(id)&&FIG[k]);}
function showFig(k){figZ=100;const m=FIGM[k]||{};const nl=(m.nodes||[]).filter(i=>BY[i]);const cuts=m.cuts||[];FIGP={k:k,cuts:cuts,i:0,full:false};
  modal('<h2>'+esc(m.t||(BY[k]||{}).n||'Figura')+'</h2><div class="figbar"><button class="sbtn" data-fz="-">−</button><button class="sbtn" data-fz="+">+</button><button class="sbtn" data-fz="0">Ajustar</button><span>Si la figura es alta se divide en paneles (flechas cortadas continúan en el panel contiguo). Las cajas con ↗ abren la ficha del nodo. Esquema conceptual de apoyo: no es un algoritmo ni sustituye al juicio clínico.</span></div>'+(cuts.length?'<div class="figpn" id="figpn"></div><div class="figcont" id="figup" hidden></div>':'')+'<div class="figwrap'+(cuts.length?' pm':'')+'" id="figwrap"><div id="figin" style="width:100%">'+FIG[k]+'</div></div>'
  +(m.cap?'<p class="figcap">'+esc(m.cap)+'</p>':'')
  +((m.refs||[]).length?'<div class="fl" style="margin-top:6px">Fuentes de la figura</div><ul class="figrefs">'+m.refs.map(r=>'<li>'+linkify(r)+'</li>').join('')+'</ul>':'')
  +(nl.length?'<div class="fl" style="margin-top:8px">Nodos relacionados</div><div class="chips">'+nl.map(i=>'<a class="chip" data-id="'+i+'">'+esc(BY[i].n)+'</a>').join(' ')+'</div>':''),true);if(cuts.length)figPanel(0);}
let FIGP=null;
function figPanel(i,full){const P=FIGP;if(!P)return;const svg=document.querySelector('#figin svg');if(!svg)return;if(!P.o)P.o=svg.getAttribute('viewBox').split(' ').map(Number);const W=P.o[2],H=P.o[3];const bounds=[0].concat(P.cuts,[H]);const n=bounds.length-1;P.full=!!full;if(i!=null)P.i=Math.max(0,Math.min(n-1,i));
  const wrap=document.getElementById('figwrap');
  if(P.full){svg.setAttribute('viewBox',P.o.join(' '));wrap.classList.remove('pm');document.getElementById('figup').hidden=true;}
  else{const OV=24;const y0=Math.max(0,bounds[P.i]-(P.i?OV:0)),y1=Math.min(H,bounds[P.i+1]+(P.i<n-1?OV:0));svg.setAttribute('viewBox','0 '+y0+' '+W+' '+(y1-y0));wrap.classList.add('pm');wrap.scrollTop=0;
    const up=document.getElementById('figup');up.hidden=false;up.textContent=(P.i>0?'▲ viene del panel '+P.i+' · ':'')+(P.i<n-1?'▼ continúa en el panel '+(P.i+2)+' · ':'')+'las flechas cortadas siguen en el panel contiguo';}
  let h='<button class="sbtn" data-fp="prev"'+(P.full||P.i===0?' disabled':'')+'>◂ Anterior</button>';
  for(let j=0;j<n;j++)h+='<button class="sbtn'+(!P.full&&j===P.i?' on':'')+'" data-fp="'+j+'" aria-label="Panel '+(j+1)+'">'+(j+1)+'</button>';
  h+='<button class="sbtn" data-fp="next"'+(P.full||P.i===n-1?' disabled':'')+'>Siguiente ▸</button><button class="sbtn'+(P.full?' on':'')+'" data-fp="full">Ver completa</button><span class="pcur">'+(P.full?'figura completa':'Panel '+(P.i+1)+' de '+n)+'</span>';
  document.getElementById('figpn').innerHTML=h;}
$('#bFig').onclick=()=>showGallery();$('#figN').textContent=Object.keys(FIGM).filter(k=>FIG[k]).length;
function showGallery(){const ks=Object.keys(FIGM).filter(k=>FIG[k]);const kinds=['dd','circ','mat','mod'];let h='<h2>Galería de figuras ('+ks.length+')</h2><p class="rleg">Esquemas vectoriales incrustados. Las cajas con ↗ de cada figura abren la ficha del nodo correspondiente; desde cada ficha se accede a sus figuras.</p>';
  kinds.forEach(kd=>{const l=ks.filter(k=>(FIGM[k].kind||'dd')===kd);if(!l.length)return;h+='<h3>'+esc(FIGK[kd])+' ('+l.length+')</h3><div class="figgal">'+l.map(k=>'<button class="figcard" data-fig="'+k+'"><div class="figthumb">'+FIG[k]+'</div><b>'+esc(FIGM[k].t||k)+'</b><span>'+(FIGM[k].nodes||[]).length+' nodos enlazados</span></button>').join('')+'</div>';});
  modal(h,true);}
document.addEventListener('click',e=>{const f=e.target.closest('[data-fig]');if(f){showFig(f.dataset.fig);return;}const fp=e.target.closest('[data-fp]');if(fp&&FIGP){const v=fp.dataset.fp;if(v==='full')figPanel(null,true);else if(v==='prev')figPanel(FIGP.i-1);else if(v==='next')figPanel(FIGP.i+1);else figPanel(+v);return;}const z=e.target.closest('[data-fz]');if(z){const v=z.dataset.fz;figZ=v==='0'?100:Math.max(50,Math.min(600,figZ+(v==='+'?50:-50)));const el=document.getElementById('figin');if(el)el.style.width=figZ+'%';const w=document.getElementById('figwrap');if(w&&FIGP&&FIGP.cuts.length&&!FIGP.full)w.classList.toggle('pm',figZ===100);}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('.mclose'))$('#modal').classList.remove('on');const r=e.target.closest('[data-id]');if(r){$('#modal').classList.remove('on');select(r.dataset.id);}const o=e.target.closest('[data-wk]');if(o)wklStep(o.dataset.wk);});
$('#bLeg').onclick=()=>{let h='<h2>Leyenda</h2><h3>Forma = tipo de nodo</h3><div class="lgrid">';
  Object.entries(CFG.KINDS).forEach(([k,o])=>{h+='<div><svg width="18" height="18" viewBox="-9 -9 18 18"><path d="'+shapePath(o.sh,4.5)+'" fill="var(--ink)"/></svg>'+esc(o.t)+'</div>';});
  h+='</div><h3>Relleno = grado de consenso</h3><div class="lgrid"><div><svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="5" fill="var(--ink)"/></svg>Alto consenso</div><div><svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="5" fill="var(--ink)" fill-opacity=".5" stroke="var(--ink)"/></svg>Consenso moderado</div><div><svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/></svg>Bajo consenso / histórico</div><div><svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="7" fill="none" stroke="var(--ink)" stroke-dasharray="1.5 1.5"/><circle r="4" fill="var(--ink)"/></svg>Forma de la clasificación WKL</div></div>';
  ['nos','sem','eti','ter'].forEach(v=>{const V=VIEWS[v];h+='<h3>'+V.t+': anillos (de dentro afuera)</h3><ol style="padding-left:18px">'+V.rings.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ol><div class="lgrid" style="margin-top:6px">'+V.sectors.map(s=>'<div><span style="width:12px;height:12px;border-radius:2px;background:'+s.c+';display:inline-block"></span>'+esc(s.t)+'</div>').join('')+'</div>';});
  modal(h);};
$('#bHelp').onclick=()=>{const c={};NODES.forEach(n=>c[n.origen||'v1']=(c[n.origen||'v1']||0)+1);
  modal('<h2>Atlas Nosológico</h2><p>Atlas interactivo de psicopatología que integra la nosología oficial (DSM-5-TR, CIE-11), las tradiciones clínicas europeas (Kraepelin, Wernicke-Kleist-Leonhard, escuela francesa, psicopatología alemana), los modelos del espectro bipolar (Akiskal, Koukopoulos, Angst), la fenomenología y el análisis existencial, la semiología descriptiva, la etiopatogenia (genética, neurodesarrollo, neurotransmisión, sistemas neuroendocrino-inmunes, circuitos, factores psicológicos y sociales) y la terapéutica.</p>'+
  '<h3>Navegación</h3><ul><li><b>Vistas</b>: Nosología, Semiología, Etiopatogenia, Terapéutica (mapas radiales por sectores y anillos), Historia (línea temporal) e Índice (tabla ordenable y exportable). Teclas <kbd>1</kbd>–<kbd>6</kbd>.</li><li><b>Buscar</b> (<kbd>/</kbd>): por nombre, sinónimo, contenido o autor de las referencias; la búsqueda también filtra el mapa.</li><li><b>Filtros</b>: combinables (O dentro de cada grupo, Y entre grupos). Por defecto atenúan; pueden ocultar.</li><li><b>Zoom</b>: rueda, pellizco, doble clic o <kbd>+</kbd>/<kbd>−</kbd>; <kbd>0</kbd> restablece. Las etiquetas aparecen al acercarse.</li><li><b>Relaciones</b>: al seleccionar un nodo se dibujan sus vínculos en la vista y se listan todos (también los de otras vistas) en la ficha.</li><li><b>Historial</b>: <kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd>; <kbd>J</kbd>/<kbd>K</kbd> recorren el sector. Cada ficha tiene un enlace directo (#id=…).</li><li><b>Figuras</b>: botón «Figuras» de la cabecera (galería) y apartado «Figuras» de cada ficha: árboles de diagnóstico diferencial y esquemas de circuitos con cajas enlazadas a las fichas (↗).</li><li><b>Temas</b>: claro, oscuro y e-ink (blanco y negro; la información no depende del color).</li></ul>'+
  '<h3>Criterios editoriales</h3><ul><li>Cada nodo lleva referencias; las cifras se atribuyen a su fuente. Las afirmaciones de escuela se identifican como tales.</li><li>El consenso indica el estatus del constructo, no su importancia clínica.</li><li>Ninguna referencia se ha añadido sin verificar su existencia; las del bloque de chemsex se contrastaron con PubMed.</li><li>† Los códigos CIE-11 se contrastaron con listados secundarios; no se pudieron verificar en la fuente oficial de la OMS (icd.who.int). Los datos que no se pudieron respaldar con una fuente oficial o primaria no se eliminan: se conservan marcados con «[fuente no localizada]».</li><li>No se ha eliminado contenido del atlas v1: los errores se corrigieron, los duplicados se fusionaron y los contenidos mal ubicados o atribuidos generaron nodos propios corregidos.</li></ul>'+
  '<h3>Origen del contenido</h3><p>Atlas v1 sin cambios: '+(c['v1']||0)+' · v1 corregido: '+(c['v1-corregido']||0)+' · nuevos derivados de correcciones: '+(c['nuevo-corrección']||0)+' · nuevos de la ampliación v2: '+(c['nuevo']||0)+'.</p>'+
  '<h3>Epistemología</h3><p>Ni panbiologicista ni panpsicologista: las categorías son convenciones con validez desigual. El atlas yuxtapone niveles de análisis (fenomenológico, clínico, neurobiológico, social) sin reducir unos a otros y da primacía al juicio clínico longitudinal.</p><p style="font-size:.75rem;color:var(--muted);margin-top:10px">Generado el '+esc(DATA.built)+'. Uso clínico y docente; no sustituye el juicio profesional.</p>');};
// guía WKL
function wklStep(k){const T=DATA.wklTree;if(!T)return;if(k==='root'||!T[k]&&!k.startsWith('r:')){}
  if(k.startsWith('r:')){const ids=k.slice(2).split(',');modal('<button class="wkback" data-hub="1">‹ Recorridos</button><h2>Guía diagnóstica WKL</h2><p class="wkh">Formas compatibles con el recorrido:</p>'+ids.map(i=>'<button class="wko" data-id="wkl'+i+'"><b>'+esc((BY['wkl'+i]||{}).n||i)+'</b><br><span style="font-size:.78rem;color:var(--muted)">'+esc(((BY['wkl'+i]||{}).feats||[''])[0])+'</span></button>').join('')+'<p style="margin-top:10px"><button class="sbtn" data-wk="root">Volver a empezar</button></p>');return;}
  const nd=T[k];modal('<button class="wkback" data-hub="1">‹ Recorridos</button><h2>Guía diagnóstica WKL</h2><p class="wkh" style="font-size:.72rem">Árbol de decisión basado en el curso longitudinal, la polaridad y el dominio psicopatológico (Leonhard). Herramienta docente: no sustituye la evaluación clínica.</p><div class="wkq">'+esc(nd.q)+'</div>'+(nd.hint?'<div class="wkh">'+esc(nd.hint)+'</div>':'')+nd.op.map(o=>'<button class="wko" data-wk="'+(o.n?o.n:'r:'+o.r.join(','))+'">'+esc(o.t)+'</button>').join('')+(k!=='root'?'<p style="margin-top:10px"><button class="sbtn" data-wk="root">Volver a empezar</button></p>':''));}
document.addEventListener('click',e=>{if(e.target.closest('[data-hub]'))showTours();});
// tema
const THEMES=['light','dark','eink'];function applyTheme(){document.body.classList.toggle('dark',st.theme==='dark');document.body.classList.toggle('eink',st.theme==='eink');$('#bTheme').textContent='Tema: '+({light:'claro',dark:'oscuro',eink:'e-ink'})[st.theme];}
$('#bTheme').onclick=()=>{st.theme=THEMES[(THEMES.indexOf(st.theme)+1)%3];store.set('theme',st.theme);applyTheme();};
function setFilt(on){const F=$('#filters');F.classList.toggle('off',!on);$('#bFilt').classList.toggle('on',on);$('#bFilt').setAttribute('aria-pressed',on?'true':'false');store.set('filt',on?1:0);
  if(st.view==='hist'){requestAnimationFrame(()=>{HIST=null;showView('hist',true);});}}
function applyAllLbl(){const b=$('#bLbl');b.classList.toggle('on',st.allLbl);b.setAttribute('aria-pressed',st.allLbl?'true':'false');b.textContent=st.allLbl?'Etiquetas: todas fijas':'Etiquetas: automáticas';
  const R=RADIAL[st.view]||(st.view==='hist'?HIST:null);if(R)labelsLOD(R);}
$('#bLbl').onclick=()=>{st.allLbl=!st.allLbl;store.set('allLbl',st.allLbl?1:0);applyAllLbl();};
$('#bFilt').onclick=()=>setFilt($('#filters').classList.contains('off'));
// teclado
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();return;}
  if(e.altKey&&e.key==='ArrowLeft'){$('#bBack').click();return;}if(e.altKey&&e.key==='ArrowRight'){$('#bFwd').click();return;}
  if(e.key==='Escape'){$('#modal').classList.remove('on');return;}
  const n=parseInt(e.key,10);if(n>=1&&n<=6&&!e.ctrlKey&&!e.metaKey){showView(VORDER[n-1]);return;}
  if(e.key==='+'||e.key==='=')$('#zIn').click();else if(e.key==='-')$('#zOut').click();else if(e.key==='0')$('#zRst').click();
  else if((e.key==='j'||e.key==='k')&&st.sel){const s=siblings(BY[st.sel]);const m=e.key==='j'?s.n:s.p;if(m)select(m.id);}});

let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(HIST&&st.view==='hist'){HIST=null;showView('hist',true);}else HIST=null;},250);});
// ---------------- arranque ----------------
$('#tabs').innerHTML=VORDER.map((v,i)=>'<button class="tab" data-v="'+v+'" title="'+VT[v]+' ('+(i+1)+')">'+VT[v]+'</button>').join('');
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)showView(t.dataset.v);});
if(innerWidth<900||!store.get('filt',0)){$('#filters').classList.add('off');$('#bFilt').classList.remove('on');$('#bFilt').setAttribute('aria-pressed','false');}else{$('#bFilt').classList.add('on');$('#bFilt').setAttribute('aria-pressed','true');}updFiltBadge();
applyTheme();showView(st.view);applyAllLbl();emptySide();updHistBtns();fromHash();
})();
</script>
</body>
